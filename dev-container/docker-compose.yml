services:
  pi:
    build:
      context: ./scripts
      dockerfile: Containerfile.pi
    image: pi-sandbox:latest
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - ~/.pi/agent:/root/.pi/agent
      - ~/.agents:/root/.agents
      - ./searxng/ketch-config.json:/root/.config/ketch/config.json:ro
    depends_on:
      searxng:
        condition: service_healthy
    networks:
      - pi-net

  searxng:
    image: searxng/searxng:latest
    environment:
      - SEARXNG_PORT=8100
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
    networks:
      - pi-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:8100/healthz",
        ]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 10s
    ports:
      # 127.0.0.1: for access from the host itself
      # 172.17.0.1: docker0 gateway, so ANY container (any bridge network)
      # can reach searxng at http://172.17.0.1:8100 without joining pi-net.
      # IP from: ip addr show docker0 | grep inet
      # Rootless Docker (rootlesskit) publishes ports on the HOST's interfaces,
      # NOT on the docker0 bridge gateway. So 172.17.0.1:8100 does NOT work from
      # containers here. Reachability:
      #   - containers in this project: http://searxng:8100 (pi-net)
      #   - any other container:        http://<host-ip>:8100 (e.g. 192.168.1.52,
      #     `ip -4 route get 1.1.1.1 | grep -oP 'src \K[0-9.]+')
      #   - host/localhost:             http://127.0.0.1:8100
      - "127.0.0.1:8100:8100"

networks:
  pi-net:
